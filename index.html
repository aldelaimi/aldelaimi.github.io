<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    DELAIMI APP - Android / iPhone app shell for the Sales Order App.
    To point the app at a different Apps Script deployment, change APP_URL near the bottom.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Delaimi App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Delaimi App">
  <style>
    :root { --red: #de0f15; --red-dark: #9a0a0f; --ink: #1c1c1e; --muted: #6b6b70; }
    html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #ffffff; }

    .screen { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 14px; padding: 24px; text-align: center; font-family: Arial, Helvetica, sans-serif; color: var(--ink);
              background:
                radial-gradient(circle at 12% 8%, rgba(222,15,21,.16) 0, rgba(222,15,21,0) 38%),
                radial-gradient(circle at 92% 94%, rgba(222,15,21,.18) 0, rgba(222,15,21,0) 42%),
                linear-gradient(180deg, #ffffff 0%, #fff6f6 55%, #ffffff 100%);
              transition: opacity .4s ease; }
    /* thin red + dark accent stripes top and bottom, echoing the logo's line */
    .screen::before, .screen::after { content: ""; position: absolute; left: 0; right: 0; height: 5px;
              background: linear-gradient(90deg, var(--red-dark), var(--red) 45%, #ff5a5f 60%, var(--red) 75%, var(--red-dark)); }
    .screen::before { top: env(safe-area-inset-top, 0); }
    .screen::after { bottom: env(safe-area-inset-bottom, 0); }

    .logo { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 14px 34px rgba(154,10,15,.28), 0 2px 6px rgba(0,0,0,.08);
            animation: pop .6s ease-out both; }
    .brand { margin: 8px 0 0; font-size: 26px; font-weight: 800; letter-spacing: .3px; color: var(--red); }
    .sub { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--ink); }
    .rule { width: 56px; height: 3px; border-radius: 3px; background: var(--ink); margin: 2px 0 6px; }
    .bar { width: 170px; height: 4px; border-radius: 4px; background: rgba(222,15,21,.15); overflow: hidden; margin-top: 10px; }
    .bar span { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--red-dark), var(--red)); animation: slide 1.1s ease-in-out infinite; }
    .msg { margin: 0; font-size: 14px; color: var(--muted); max-width: 290px; line-height: 1.45; }
    button { margin-top: 6px; background: linear-gradient(135deg, var(--red), var(--red-dark)); color: #fff; border: 0; border-radius: 12px;
             padding: 13px 30px; font-size: 15px; font-weight: 700; box-shadow: 0 8px 20px rgba(222,15,21,.3); }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .hide { opacity: 0; pointer-events: none; }
    .gone { display: none; }
  </style>
</head>
<body>
  <div id="splash" class="screen">
    <img class="logo" src="icons/icon-512.png" alt="">
    <h1 class="brand">Delaimi App</h1>
    <div class="rule"></div>
    <p class="sub">Al-Delaimi Trading Est.</p>
    <div class="bar"><span></span></div>
  </div>

  <div id="offline" class="screen gone">
    <img class="logo" src="icons/icon-512.png" alt="">
    <h1 class="brand">No internet connection</h1>
    <p class="msg">Delaimi App needs internet. Check mobile data or Wi-Fi, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>

  <iframe id="app" title="Delaimi App" allow="camera; clipboard-read; clipboard-write; fullscreen; web-share"></iframe>

  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbx_2ObFpNJ7uHktn0qcJlSG4nzkVlMJ9I1DGIgxD_pMSEJfygnvRga4x1SRncB1VV19JA/exec";

    var splash = document.getElementById('splash');
    var offline = document.getElementById('offline');
    var frame = document.getElementById('app');

    function hideSplash() {
      splash.classList.add('hide');
      setTimeout(function () { splash.classList.add('gone'); }, 450);
    }

    if (!navigator.onLine) {
      splash.classList.add('gone');
      offline.classList.remove('gone');
    } else {
      frame.addEventListener('load', hideSplash);
      setTimeout(hideSplash, 8000); // never leave the splash stuck on screen
      frame.src = APP_URL;
    }

    window.addEventListener('online', function () {
      if (!offline.classList.contains('gone')) location.reload();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
